name: Common airport Checkin

on:
  schedule:
    - cron: '10 16 * * *' # 每天北京时间 00:10
  workflow_dispatch:
  push:
    paths: ['.github/workflows/main.yml', 'main.py', 'requirements.txt', 'tests/**']

permissions:
  contents: read

concurrency:
  group: airport-checkin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.3
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Test check-in behavior
        run: python -m unittest discover -s tests -v
      - name: Run sign
        if: github.event_name != 'push'
        env:
          PYTHONUNBUFFERED: '1'
          URL: ${{ secrets.URL }}
          SCKEY: ${{ secrets.SCKEY }}
          COOKIE: ${{ secrets.COOKIE }}
        run: python main.py
